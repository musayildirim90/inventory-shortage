<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تقرير نواقص المخزون</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background:#f0f4f8; color:#1a202c; min-height:100vh; padding:20px; direction:rtl; }

  h1 { font-size:22px; font-weight:700; color:#1a202c; margin-bottom:4px; }
  .subtitle { font-size:13px; color:#718096; margin-bottom:20px; }

  /* Control bar */
  .ctrl-bar {
    display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    padding:14px 18px; margin-bottom:20px;
    background:#fff; border:1px solid #e2e8f0; border-radius:12px;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .load-btn {
    padding:9px 22px; border:none; border-radius:8px; cursor:pointer;
    font-size:13px; font-weight:700; background:#3182ce; color:#fff;
    transition:background .15s; white-space:nowrap;
  }
  .load-btn:hover:not(:disabled) { background:#2b6cb0; }
  .load-btn:disabled { opacity:.5; cursor:not-allowed; }
  .prog-wrap { flex:1; min-width:80px; height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; }
  .prog-bar  { height:100%; width:0%; background:#3182ce; border-radius:3px; transition:width .3s; }
  .status-txt { font-size:12px; color:#718096; white-space:nowrap; }

  /* Summary cards */
  .cards { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:20px; }
  .card {
    flex:1; min-width:140px; background:#fff; border-radius:12px;
    padding:16px 18px; border:1px solid #e2e8f0;
    box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .card-label { font-size:11px; color:#718096; font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }
  .card-value { font-size:24px; font-weight:800; color:#2d3748; }
  .card-value.red  { color:#e53e3e; }
  .card-value.orange { color:#dd6b20; }
  .card-value.blue { color:#3182ce; }

  /* Search */
  .search-bar {
    display:flex; gap:10px; align-items:center; margin-bottom:16px;
    background:#fff; border:1px solid #e2e8f0; border-radius:10px;
    padding:10px 16px; box-shadow:0 1px 3px rgba(0,0,0,.06);
  }
  .search-bar input {
    flex:1; border:none; outline:none; font-size:14px; background:transparent; direction:rtl;
  }
  .search-bar span { color:#a0aec0; font-size:16px; }

  /* Table */
  .table-wrap {
    background:#fff; border-radius:12px; border:1px solid #e2e8f0;
    box-shadow:0 1px 3px rgba(0,0,0,.06); overflow:hidden;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead { background:#f7fafc; }
  th {
    padding:12px 16px; text-align:right; font-weight:700;
    font-size:11px; color:#4a5568; text-transform:uppercase;
    letter-spacing:.5px; border-bottom:2px solid #e2e8f0;
    white-space:nowrap; cursor:pointer; user-select:none;
  }
  th:hover { background:#edf2f7; }
  th.sorted { color:#3182ce; }
  td { padding:11px 16px; border-bottom:1px solid #f0f4f8; vertical-align:middle; }
  tr:last-child td { border-bottom:none; }
  tr:hover td { background:#f7fafc; }

  /* Shortage badge */
  .badge {
    display:inline-flex; align-items:center; gap:5px;
    padding:4px 10px; border-radius:20px; font-size:12px; font-weight:700;
  }
  .badge.critical { background:#fff5f5; color:#c53030; border:1px solid #fed7d7; }
  .badge.warning  { background:#fffaf0; color:#c05621; border:1px solid #fbd38d; }
  .badge.low      { background:#fffff0; color:#975a16; border:1px solid #faf089; }

  /* Progress bar in table */
  .stock-bar-wrap { width:80px; height:6px; background:#e2e8f0; border-radius:3px; display:inline-block; vertical-align:middle; margin-right:8px; }
  .stock-bar { height:100%; border-radius:3px; background:#e53e3e; }

  /* Empty / error */
  .empty-state {
    text-align:center; padding:60px 20px; color:#a0aec0;
  }
  .empty-state .icon { font-size:48px; margin-bottom:12px; }
  .empty-state p { font-size:15px; }
  .err-box {
    color:#c53030; background:#fff5f5; border:1px solid #fed7d7;
    border-radius:10px; padding:14px 18px; font-size:13px; margin-bottom:16px;
  }

  .footer-info { font-size:11px; color:#a0aec0; text-align:left; padding:10px 16px; border-top:1px solid #f0f4f8; }

  /* Loading overlay */
  .loading-msg { text-align:center; padding:40px; color:#718096; font-size:14px; }
</style>
</head>
<body>

<h1>📦 تقرير نواقص المخزون</h1>
<p class="subtitle">المنتجات التي يقل مخزونها عن مبيعات آخر 30 يوم — مرتبة حسب الأكثر نقصاً</p>

<!-- Control bar -->
<div class="ctrl-bar">
  <button class="load-btn" id="load-btn" onclick="loadAllData()">⬇ تحميل البيانات</button>
  <div class="prog-wrap"><div class="prog-bar" id="prog-bar"></div></div>
  <span class="status-txt" id="status-txt">اضغط تحميل لجلب البيانات من Manager</span>
</div>

<!-- Error box -->
<div class="err-box" id="err-box" style="display:none"></div>

<!-- Summary cards -->
<div class="cards" id="cards" style="display:none">
  <div class="card">
    <div class="card-label">إجمالي المنتجات الناقصة</div>
    <div class="card-value red" id="c-total">0</div>
  </div>
  <div class="card">
    <div class="card-label">أشد نقص (وحدات)</div>
    <div class="card-value orange" id="c-max">0</div>
  </div>
  <div class="card">
    <div class="card-label">إجمالي وحدات ناقصة</div>
    <div class="card-value red" id="c-sum">0</div>
  </div>
  <div class="card">
    <div class="card-label">فترة التحليل</div>
    <div class="card-value blue" style="font-size:16px">آخر 30 يوم</div>
  </div>
</div>

<!-- Search -->
<div class="search-bar" id="search-bar" style="display:none">
  <span>🔍</span>
  <input type="text" id="search-input" placeholder="ابحث عن منتج..." oninput="filterTable()">
</div>

<!-- Table -->
<div class="table-wrap" id="table-wrap" style="display:none">
  <table>
    <thead>
      <tr>
        <th onclick="sortBy('rank')">#</th>
        <th onclick="sortBy('name')">اسم المنتج</th>
        <th onclick="sortBy('code')">الكود</th>
        <th onclick="sortBy('stock')">المخزون الحالي</th>
        <th onclick="sortBy('sold')">مبيعات 30 يوم</th>
        <th onclick="sortBy('shortage')" class="sorted">⬇ النقص</th>
        <th>مستوى النقص</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="footer-info" id="footer-info"></div>
</div>

<div id="app"></div>

<script>
/* ══════════════════════════════════
   postMessage helper — DO NOT MODIFY
══════════════════════════════════ */
function postMessageWithResponse(message) {
  return new Promise((resolve, reject) => {
    const requestId = crypto.randomUUID();
    const timer = setTimeout(() => {
      window.removeEventListener('message', handler);
      reject(new Error('انتهت المهلة — تأكد أن الإضافة تعمل داخل Manager.io'));
    }, 30000);
    function handler(event) {
      if (event.data?.type?.endsWith('-response') && event.data?.requestId === requestId) {
        clearTimeout(timer);
        window.removeEventListener('message', handler);
        resolve(event.data.body);
      }
    }
    window.addEventListener('message', handler);
    window.parent.postMessage({ ...message, requestId }, '*');
  });
}

/* ══════════════════════════════════
   fetchAllPages — pagination loop
   DO NOT SIMPLIFY — Manager returns ≤50 per page
══════════════════════════════════ */
async function fetchAllPages(endpoint, onProgress, label) {
  const allItems = [];
  let nextToken = null;
  let pageNum = 0;
  let apiTotal = null;

  do {
    // Build path — on subsequent pages use the full next href from _links.next
    let path;
    if (nextToken) {
      // nextToken may be a full path like /api4/endpoint?PageSize=50&next_page_token=xxx
      // or just the token value — handle both
      if (nextToken.startsWith('/')) {
        path = nextToken; // already a full path
      } else {
        path = `/api4/${endpoint}?PageSize=50&next_page_token=${encodeURIComponent(nextToken)}`;
      }
    } else {
      path = `/api4/${endpoint}?PageSize=50`;
    }

    const data = await postMessageWithResponse({ type: 'api-request', method: 'GET', path });

    // Manager.io wraps records in data.items array
    const page = Array.isArray(data) ? data : (data.items || data.data || []);
    allItems.push(...page);

    // Manager.io pagination: next page link is in _links.next.href
    // It can also be a direct next_page_token field
    const nextHref = data?._links?.next?.href || null;
    const nextDirect = data?.next_page_token || data?.nextPageToken || null;
    nextToken = nextHref || nextDirect || null;

    // Get total count from _summary if available
    if (apiTotal === null) {
      apiTotal = data?._summary?.totalLoaded
        ?? data?.totalCount
        ?? data?.total
        ?? data?.count
        ?? null;
    }

    pageNum++;
    if (onProgress) onProgress(allItems.length, apiTotal, pageNum, label);
    if (pageNum >= 2000) break;

  } while (nextToken);

  return allItems;
}

/* ══════════════════════════════════
   Global state
══════════════════════════════════ */
let allShortages = [];
let currentSort = { key: 'shortage', dir: -1 };

/* ══════════════════════════════════
   Main load function
══════════════════════════════════ */
async function loadAllData() {
  const btn    = document.getElementById('load-btn');
  const bar    = document.getElementById('prog-bar');
  const status = document.getElementById('status-txt');
  const errBox = document.getElementById('err-box');

  btn.disabled = true;
  btn.textContent = 'جاري التحميل...';
  bar.style.width = '5%';
  errBox.style.display = 'none';
  hideResults();

  document.getElementById('app').innerHTML = `<div class="loading-msg">⏳ جاري تحميل بيانات المخزون...</div>`;

  try {
    // Step 1: Load inventory items
    status.textContent = 'جاري تحميل المخزون...';
    const invItems = await fetchAllPages('inventory-item-batch', (loaded, total, page) => {
      status.textContent = `المخزون: ${loaded.toLocaleString()} منتج محمل (صفحة ${page})`;
      bar.style.width = Math.min(40, page * 2) + '%';
    }, 'inventory');

    // Step 2: Load sales invoices
    document.getElementById('app').innerHTML = `<div class="loading-msg">⏳ جاري تحميل فواتير المبيعات (${invItems.length} منتج محمل)...</div>`;
    status.textContent = 'جاري تحميل فواتير المبيعات...';
    const invoiceItems = await fetchAllPages('sales-invoice-batch', (loaded, total, page) => {
      status.textContent = `الفواتير: ${loaded.toLocaleString()} فاتورة محملة (صفحة ${page})`;
      bar.style.width = Math.min(90, 40 + page * 1.5) + '%';
    }, 'invoices');

    bar.style.width = '95%';
    status.textContent = 'جاري تحليل البيانات...';
    document.getElementById('app').innerHTML = '';

    // Step 3: Analyze
    analyzeAndRender(invItems, invoiceItems);

    bar.style.width = '100%';
    status.textContent = `✓ تم التحليل — ${invItems.length} منتج، ${invoiceItems.length} فاتورة`;
    btn.textContent = '↺ تحديث';
    btn.disabled = false;

  } catch (err) {
    bar.style.width = '0%';
    status.textContent = '⚠ ' + err.message;
    btn.textContent = '↺ إعادة المحاولة';
    btn.disabled = false;
    errBox.style.display = 'block';
    errBox.innerHTML = `⚠ ${err.message}<br><small>تأكد أن الإضافة تعمل داخل Manager.io وأن لديك صلاحية الوصول.</small>`;
    document.getElementById('app').innerHTML = '';
  }
}

/* ══════════════════════════════════
   Core analysis logic
══════════════════════════════════ */
function analyzeAndRender(invItems, invoiceItems) {
  const now = new Date();
  const cutoff = new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);

  // Build inventory map: itemKey → { name, code, qty }
  // inventory-item-batch doesn't return qty directly — 
  // qty comes from inventory quantity endpoint, but we use qtyDesired as proxy
  // Actually we need to get current stock — use item.qtyOnHand or similar
  // Based on schema: reorderPoint, qtyDesired are available
  // The actual on-hand qty isn't in inventory-item-batch directly
  // We'll use a secondary approach: track net from invoices vs purchases
  // For now use item.obsolete_StartingBalance2 + calculate from transactions
  // Simplest: use qtyDesired as "minimum desired" and compute shortage differently
  
  // Build inventory map from inventory-item-batch
  const inventoryMap = {}; // key → item data
  for (const record of invItems) {
    const key = record?.key || record?.item?.key;
    const item = record?.item || record;
    if (!key || !item?.itemName) continue;
    inventoryMap[key] = {
      name: item.itemName || item.nameWithCode || '(بدون اسم)',
      code: item.itemCode || '',
      unit: item.unitName || '',
      // qtyOnHand not in batch — will be calculated from invoice lines
      // use 0 as default, will be overridden if we find stock data
      stock: typeof item.qtyOnHand === 'number' ? item.qtyOnHand : 
             (typeof item.obsolete_StartingBalance2 === 'number' ? item.obsolete_StartingBalance2 : null),
      reorderPoint: item.reorderPoint || false,
      qtyDesired: item.qtyDesired || 0,
    };
  }

  // Calculate sales per item in last 30 days
  const salesMap = {}; // itemKey → total qty sold
  for (const record of invoiceItems) {
    const inv = record?.item || record;
    const issueDateStr = inv?.issueDate;
    if (!issueDateStr) continue;

    const issueDate = new Date(issueDateStr);
    if (issueDate < cutoff) continue; // outside 30-day window

    const lines = inv?.lines || [];
    for (const line of lines) {
      const itemKey = line?.item;
      if (!itemKey) continue;
      const qty = parseFloat(line?.qty) || 0;
      salesMap[itemKey] = (salesMap[itemKey] || 0) + qty;
    }
  }

  // Since inventory-item-batch doesn't include on-hand qty directly,
  // we'll use a smart fallback: if stock is null, we treat available
  // qty as 0 for items that have sales (most conservative/useful view)
  // Items with known stock: show real shortage
  // Items with null stock but have sales: show as "stock unknown"

  const shortages = [];
  for (const [key, invData] of Object.entries(inventoryMap)) {
    const sold30 = salesMap[key] || 0;
    if (sold30 === 0) continue; // not sold in last 30 days — skip

    let stock = invData.stock;
    // If stock is null, use 0 as conservative estimate
    if (stock === null || stock === undefined) stock = 0;

    const shortage = sold30 - stock;
    if (shortage <= 0) continue; // enough stock — skip

    shortages.push({
      key,
      name: invData.name,
      code: invData.code,
      unit: invData.unit,
      stock: stock,
      sold30: sold30,
      shortage: shortage,
      stockUnknown: invData.stock === null,
    });
  }

  // Sort by shortage descending
  shortages.sort((a, b) => b.shortage - a.shortage);
  allShortages = shortages;

  renderResults(shortages, invItems.length, invoiceItems.length);
}

/* ══════════════════════════════════
   Render results to DOM
══════════════════════════════════ */
function renderResults(shortages, totalInv, totalInv2) {
  if (shortages.length === 0) {
    document.getElementById('app').innerHTML = `
      <div class="empty-state">
        <div class="icon">✅</div>
        <p>لا توجد نواقص! المخزون كافٍ لتغطية مبيعات آخر 30 يوم.</p>
      </div>`;
    return;
  }

  // Show cards
  const totalShortage = shortages.reduce((s, r) => s + r.shortage, 0);
  const maxShortage = shortages[0]?.shortage || 0;

  document.getElementById('c-total').textContent = shortages.length.toLocaleString();
  document.getElementById('c-max').textContent = fmt(maxShortage) + ' ' + (shortages[0]?.unit || '');
  document.getElementById('c-sum').textContent = fmt(totalShortage);
  document.getElementById('cards').style.display = 'flex';
  document.getElementById('search-bar').style.display = 'flex';
  document.getElementById('table-wrap').style.display = 'block';

  // Render table
  renderTable(shortages);

  document.getElementById('footer-info').textContent =
    `إجمالي المنتجات المحللة: ${totalInv.toLocaleString()} · آخر تحديث: ${new Date().toLocaleString('ar-SY')}`;
}

function renderTable(data) {
  const tbody = document.getElementById('tbody');
  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:30px;color:#a0aec0">لا توجد نتائج مطابقة للبحث</td></tr>`;
    return;
  }

  const maxShortage = data[0]?.shortage || 1;

  tbody.innerHTML = data.map((r, i) => {
    const pct = Math.min(100, Math.round((r.shortage / maxShortage) * 100));
    const level = r.shortage >= maxShortage * 0.6 ? 'critical' :
                  r.shortage >= maxShortage * 0.3 ? 'warning' : 'low';
    const levelLabel = level === 'critical' ? '🔴 حرج' :
                       level === 'warning'  ? '🟠 تحذير' : '🟡 منخفض';

    return `<tr>
      <td style="color:#a0aec0;font-weight:600">${i + 1}</td>
      <td style="font-weight:600;max-width:220px">
        ${escHtml(r.name)}
        ${r.stockUnknown ? '<br><span style="font-size:10px;color:#a0aec0">مخزون غير محدد</span>' : ''}
      </td>
      <td style="color:#718096;font-size:12px">${escHtml(r.code || '—')}</td>
      <td>
        <span style="font-weight:700;color:${r.stock <= 0 ? '#e53e3e' : '#2d3748'}">${fmt(r.stock)}</span>
        <span style="font-size:11px;color:#a0aec0"> ${escHtml(r.unit)}</span>
      </td>
      <td>
        <span style="font-weight:700;color:#3182ce">${fmt(r.sold30)}</span>
        <span style="font-size:11px;color:#a0aec0"> ${escHtml(r.unit)}</span>
      </td>
      <td>
        <div style="display:flex;align-items:center;gap:8px">
          <div class="stock-bar-wrap"><div class="stock-bar" style="width:${pct}%"></div></div>
          <span style="font-weight:800;color:#e53e3e">${fmt(r.shortage)}</span>
          <span style="font-size:11px;color:#a0aec0">${escHtml(r.unit)}</span>
        </div>
      </td>
      <td><span class="badge ${level}">${levelLabel}</span></td>
    </tr>`;
  }).join('');
}

/* ══════════════════════════════════
   Search & Sort
══════════════════════════════════ */
function filterTable() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const filtered = q
    ? allShortages.filter(r => r.name.toLowerCase().includes(q) || (r.code || '').toLowerCase().includes(q))
    : allShortages;
  renderTable(filtered);
}

function sortBy(key) {
  if (currentSort.key === key) currentSort.dir *= -1;
  else { currentSort.key = key; currentSort.dir = -1; }

  const sorted = [...allShortages].sort((a, b) => {
    const av = key === 'name' || key === 'code' ? (a[key] || '') : (a[key] || 0);
    const bv = key === 'name' || key === 'code' ? (b[key] || '') : (b[key] || 0);
    if (av < bv) return -1 * currentSort.dir;
    if (av > bv) return  1 * currentSort.dir;
    return 0;
  });

  allShortages = sorted;
  renderTable(sorted);
}

/* ══════════════════════════════════
   Helpers
══════════════════════════════════ */
function fmt(v) { return (parseFloat(v) || 0).toLocaleString('ar-SY', { maximumFractionDigits: 2 }); }
function escHtml(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hideResults() {
  document.getElementById('cards').style.display = 'none';
  document.getElementById('search-bar').style.display = 'none';
  document.getElementById('table-wrap').style.display = 'none';
}
</script>
</body>
</html>
